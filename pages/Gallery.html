<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>銀の畫廊</title>
    <link rel="stylesheet" href="../styles/Gallery.css">
    <link rel="stylesheet" href="../styles/Font.css">
</head>
<body>
    <div class="container">
        <div class="title">★ 銀の畫廊 ★</div>

        <div class="toolbar">
            <span class="counter" id="countDisplay">Total: 0</span>
            <div class="row-height-control">
                <label>Row Height</label>
                <input type="range" id="rowHeightSlider" min="60" max="300" value="120" step="2">
                <span class="height-value" id="heightDisplay">120</span>
            </div>
        </div>

        <!-- 顶部三张图片：横向排布，总宽与下方网格容器一致 -->
        <div class="hero-trio" id="heroTrio">
            <div class="hero-trio-item">
                <img src="" alt="Image1" id="heroImg1" loading="eager">
            </div>
            <div class="hero-trio-item">
                <img src="" alt="Image2" id="heroImg2" loading="eager">
            </div>
            <div class="hero-trio-item">
                <img src="" alt="Image3" id="heroImg3" loading="eager">
            </div>
        </div>

        <!-- 图片网格 -->
        <div class="grid" id="gridContainer"></div>

        <footer>POWERED BY JZWSBDEM</footer>
    </div>

    <script src="../scripts/Gallery.js"></script>
</body>
</html>
